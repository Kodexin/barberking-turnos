<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BarberKing Turnos — Reservar cita</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">Barber<em>King</em> Turnos</div>
    <div class="topbar-right">
      <span class="whoami">Hola, <strong id="nombre-usuario"></strong><span class="badge-rol">cliente</span></span>
      <button class="btn btn-ghost btn-small" id="btn-salir">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <div class="section-head">
      <h1>Reserva tu cita</h1>
    </div>

    <div class="panel">
      <div class="stepper">
        <div class="step-dot active" data-step="1">1. Servicio</div>
        <div class="step-dot" data-step="2">2. Barbero</div>
        <div class="step-dot" data-step="3">3. Fecha</div>
        <div class="step-dot" data-step="4">4. Horario</div>
      </div>

      <div id="paso-1">
        <h3>Elige el servicio</h3>
        <div id="lista-servicios" class="option-grid"></div>
      </div>

      <div id="paso-2" class="hidden">
        <h3>Elige el barbero</h3>
        <div id="lista-barberos" class="option-grid"></div>
      </div>

      <div id="paso-3" class="hidden">
        <h3>Elige la fecha</h3>
        <div class="field" style="max-width: 220px;">
          <input type="date" id="input-fecha" />
        </div>
      </div>

      <div id="paso-4" class="hidden">
        <h3>Horarios disponibles</h3>
        <div id="lista-horarios" class="slot-grid"></div>
        <p id="sin-horarios" class="empty-state hidden">No hay horarios disponibles ese día con ese barbero. Prueba otra fecha.</p>
      </div>

      <div style="display:flex; gap:0.6rem; margin-top:1.5rem;">
        <button class="btn btn-ghost hidden" id="btn-atras">Atrás</button>
        <button class="btn btn-primary hidden" id="btn-confirmar">Confirmar reserva</button>
      </div>
    </div>

    <div class="panel">
      <div class="section-head">
        <h2>Mis citas</h2>
      </div>
      <div id="lista-mis-citas"></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  const usuario = Sesion.exigir("cliente");
  if (usuario) iniciar();

  let estado = { servicio: null, barbero: null, fecha: null, horario: null };

  async function iniciar() {
    document.getElementById("nombre-usuario").textContent = usuario.nombre;
    document.getElementById("btn-salir").addEventListener("click", Sesion.cerrar);
    document.getElementById("input-fecha").min = hoyISO();
    document.getElementById("input-fecha").value = hoyISO();

    document.getElementById("btn-atras").addEventListener("click", irPasoAnterior);
    document.getElementById("btn-confirmar").addEventListener("click", confirmarReserva);
    document.getElementById("input-fecha").addEventListener("change", () => {
      estado.fecha = document.getElementById("input-fecha").value;
    });

    await Promise.all([cargarServicios(), cargarBarberos()]);
    estado.fecha = document.getElementById("input-fecha").value;
    await cargarMisCitas();
    render();
  }

  async function cargarServicios() {
    const servicios = await api("/servicios");
    const cont = document.getElementById("lista-servicios");
    cont.innerHTML = "";
    servicios.forEach((s) => {
      const el = document.createElement("div");
      el.className = "option-card";
      el.innerHTML = `<div class="opt-title">${s.nombre}</div><div class="opt-sub">${s.duracion_min} min · ${formatoMoneda(s.precio)}</div>`;
      el.addEventListener("click", () => {
        estado.servicio = s;
        document.querySelectorAll("#lista-servicios .option-card").forEach((c) => c.classList.remove("selected"));
        el.classList.add("selected");
        irPasoSiguiente(2);
      });
      cont.appendChild(el);
    });
  }

  async function cargarBarberos() {
    const barberos = await api("/auth/barberos");
    const cont = document.getElementById("lista-barberos");
    cont.innerHTML = "";
    barberos.forEach((b) => {
      const el = document.createElement("div");
      el.className = "option-card";
      el.innerHTML = `<div class="opt-title">${b.nombre}</div><div class="opt-sub">Barbero</div>`;
      el.addEventListener("click", () => {
        estado.barbero = b;
        document.querySelectorAll("#lista-barberos .option-card").forEach((c) => c.classList.remove("selected"));
        el.classList.add("selected");
        irPasoSiguiente(3);
      });
      cont.appendChild(el);
    });
  }

  let pasoActual = 1;
  function render() {
    [1, 2, 3, 4].forEach((n) => {
      document.getElementById(`paso-${n}`).classList.toggle("hidden", n !== pasoActual);
      const dot = document.querySelector(`.step-dot[data-step="${n}"]`);
      dot.classList.toggle("active", n === pasoActual);
      dot.classList.toggle("done", n < pasoActual);
    });
    document.getElementById("btn-atras").classList.toggle("hidden", pasoActual === 1);
    document.getElementById("btn-confirmar").classList.toggle("hidden", !(pasoActual === 4 && estado.horario));
    if (pasoActual === 4) cargarHorarios();
  }

  function irPasoSiguiente(n) {
    pasoActual = n;
    render();
  }
  function irPasoAnterior() {
    if (pasoActual > 1) {
      pasoActual -= 1;
      render();
    }
  }

  async function cargarHorarios() {
    if (!estado.servicio || !estado.barbero || !estado.fecha) return;
    const cont = document.getElementById("lista-horarios");
    const vacio = document.getElementById("sin-horarios");
    cont.innerHTML = "";
    estado.horario = null;
    document.getElementById("btn-confirmar").classList.add("hidden");

    try {
      const data = await api(
        `/citas/disponibilidad?barbero_id=${estado.barbero.id}&servicio_id=${estado.servicio.id}&fecha=${estado.fecha}`
      );
      vacio.classList.toggle("hidden", data.horarios.length > 0);
      data.horarios.forEach((h) => {
        const btn = document.createElement("div");
        btn.className = "slot-btn";
        btn.textContent = h.hora_inicio;
        btn.addEventListener("click", () => {
          estado.horario = h;
          document.querySelectorAll(".slot-btn").forEach((s) => s.classList.remove("selected"));
          btn.classList.add("selected");
          document.getElementById("btn-confirmar").classList.remove("hidden");
        });
        cont.appendChild(btn);
      });
    } catch (err) {
      mostrarToast(err.message, "error");
    }
  }

  async function confirmarReserva() {
    try {
      const data = await api("/citas", {
        method: "POST",
        body: {
          barbero_id: estado.barbero.id,
          servicio_id: estado.servicio.id,
          fecha: estado.fecha,
          hora_inicio: estado.horario.hora_inicio,
        },
      });
      mostrarToast("Cita confirmada. " + data.notificacion, "success");
      estado = { servicio: null, barbero: null, fecha: document.getElementById("input-fecha").value, horario: null };
      document.querySelectorAll(".option-card.selected, .slot-btn.selected").forEach((c) => c.classList.remove("selected"));
      pasoActual = 1;
      render();
      await cargarMisCitas();
    } catch (err) {
      mostrarToast(err.message, "error");
    }
  }

  async function cargarMisCitas() {
    const citas = await api("/citas/mias");
    const cont = document.getElementById("lista-mis-citas");
    if (citas.length === 0) {
      cont.innerHTML = `<p class="empty-state">Todavía no tienes citas reservadas.</p>`;
      return;
    }
    cont.innerHTML = "";
    citas.forEach((c) => {
      const row = document.createElement("div");
      row.className = "cita-row";
      const puedeCancelar = c.estado === "confirmada";
      row.innerHTML = `
        <div class="cita-info">
          <div class="cita-servicio">${c.servicio_nombre} con ${c.barbero_nombre}</div>
          <div class="cita-meta">${formatoFechaLarga(c.fecha)} · ${c.hora_inicio} · ${formatoMoneda(c.servicio_precio)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:0.6rem;">
          <span class="pill pill-${c.estado}">${c.estado}</span>
          ${puedeCancelar ? `<button class="btn btn-danger btn-small" data-cancelar="${c.id}">Cancelar</button>` : ""}
        </div>
      `;
      cont.appendChild(row);
    });

    cont.querySelectorAll("[data-cancelar]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("¿Cancelar esta cita?")) return;
        try {
          await api(`/citas/${btn.dataset.cancelar}/cancelar`, { method: "PATCH" });
          mostrarToast("Cita cancelada.", "success");
          cargarMisCitas();
        } catch (err) {
          mostrarToast(err.message, "error");
        }
      });
    });
  }
</script>
</body>
</html>
