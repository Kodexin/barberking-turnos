<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BarberKing Turnos — Mi agenda</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">Barber<em>King</em> Turnos</div>
    <div class="topbar-right">
      <span class="whoami">Hola, <strong id="nombre-usuario"></strong><span class="badge-rol">barbero</span></span>
      <button class="btn btn-ghost btn-small" id="btn-salir">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <div class="section-head">
      <h1>Mi agenda</h1>
      <input type="date" id="input-fecha" style="max-width: 200px;" />
    </div>

    <div class="panel">
      <div id="agenda-vacia" class="empty-state hidden">No tienes citas programadas para este día.</div>
      <div id="agenda-timeline" class="timeline"></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  const usuario = Sesion.exigir("barbero");
  if (usuario) iniciar();

  function iniciar() {
    document.getElementById("nombre-usuario").textContent = usuario.nombre;
    document.getElementById("btn-salir").addEventListener("click", Sesion.cerrar);

    const inputFecha = document.getElementById("input-fecha");
    inputFecha.value = hoyISO();
    inputFecha.addEventListener("change", cargarAgenda);
    cargarAgenda();
  }

  async function cargarAgenda() {
    const fecha = document.getElementById("input-fecha").value;
    const cont = document.getElementById("agenda-timeline");
    const vacio = document.getElementById("agenda-vacia");

    try {
      const citas = await api(`/citas/agenda?fecha=${fecha}`);
      vacio.classList.toggle("hidden", citas.length > 0);
      cont.innerHTML = "";

      citas.forEach((c) => {
        const item = document.createElement("div");
        item.className = `timeline-item estado-${c.estado}`;
        const acciones = [];
        if (c.estado === "confirmada") {
          acciones.push(`<button class="btn btn-ghost btn-small" data-atender="${c.id}">Marcar atendida</button>`);
          acciones.push(`<button class="btn btn-ghost btn-small" data-recordar="${c.id}">Enviar recordatorio</button>`);
          acciones.push(`<button class="btn btn-danger btn-small" data-cancelar="${c.id}">Cancelar</button>`);
        }
        item.innerHTML = `
          <div class="timeline-time">${c.hora_inicio} – ${c.hora_fin}</div>
          <div class="timeline-body">
            <div>
              <div style="font-weight:600;">${c.servicio_nombre}</div>
              <div class="timeline-meta">${c.cliente_nombre} · <span class="pill pill-${c.estado}">${c.estado}</span></div>
            </div>
            <div class="timeline-actions">${acciones.join("")}</div>
          </div>
        `;
        cont.appendChild(item);
      });

      cont.querySelectorAll("[data-atender]").forEach((btn) =>
        btn.addEventListener("click", () => actualizarEstado(btn.dataset.atender, "atendida"))
      );
      cont.querySelectorAll("[data-cancelar]").forEach((btn) =>
        btn.addEventListener("click", () => {
          if (confirm("¿Cancelar esta cita?")) actualizarEstado(btn.dataset.cancelar, "cancelada");
        })
      );
      cont.querySelectorAll("[data-recordar]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          try {
            const data = await api(`/citas/${btn.dataset.recordar}/recordatorio`, { method: "POST" });
            mostrarToast(data.mensaje, "success");
          } catch (err) {
            mostrarToast(err.message, "error");
          }
        })
      );
    } catch (err) {
      mostrarToast(err.message, "error");
    }
  }

  async function actualizarEstado(citaId, estado) {
    try {
      await api(`/citas/${citaId}/estado`, { method: "PATCH", body: { estado } });
      mostrarToast(`Cita marcada como ${estado}.`, "success");
      cargarAgenda();
    } catch (err) {
      mostrarToast(err.message, "error");
    }
  }
</script>
</body>
</html>
